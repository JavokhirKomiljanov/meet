<style>
  :root {
    --ink: #131313; --body: #5c5d5f; --muted: #8a8a8a;
    --mint: #07e7b7; --mint-d: #05a884; --mint-l: #74dfc8; --tint: #eefcf8; --tint2: #e3faf4;
    --blue-tint: #e8f1ff; --card: #f6f7f8; --line: #e6e8ea; --white: #fff; --danger: #e5484d;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--white); color: var(--body); font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; -webkit-tap-highlight-color: transparent; }
  a { color: inherit; }
  h1, h2 { font-family: Manrope, Inter, sans-serif; color: var(--ink); letter-spacing: -.025em; margin: 0; }
  .hl { color: var(--mint-d); }
  svg { display: block; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--mint-d); outline-offset: 2px; }

  /* ---------- top bar ---------- */
  .top { max-width: 1120px; margin: 0 auto; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
  .brand img { width: 36px; height: 36px; flex: none; }
  .brand b { display: block; font: 800 16px/1.15 Manrope, Inter, sans-serif; letter-spacing: -.01em; }
  .brand small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lang { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; flex: none; }
  .lang button { padding: 6px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
  .lang button[aria-pressed="true"] { background: var(--white); color: var(--ink); box-shadow: 0 1px 2px rgba(16,24,40,.08); }

  /* ---------- layout ---------- */
  .wrap { max-width: 1120px; margin: 0 auto; padding: 4px 20px 32px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
  @media (min-width: 960px) {
    .wrap { grid-template-columns: 360px minmax(0, 1fr); gap: 56px; padding-top: 28px; }
    .intro { position: sticky; top: 24px; align-self: start; }
  }
  .eyebrow { margin: 0 0 12px; font: 700 11px/1 Inter, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--mint-d); }
  h1 { font-size: clamp(30px, 5vw, 44px); font-weight: 800; line-height: 1.08; margin-bottom: 12px; }
  .lead { margin: 0 0 18px; font-size: 16px; max-width: 46ch; }
  .facts { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .facts li { display: flex; align-items: center; gap: 8px; color: var(--ink); font-weight: 500; font-size: 14px; background: var(--card); border-radius: 999px; padding: 6px 12px 6px 6px; }
  .facts i { width: 24px; height: 24px; border-radius: 50%; background: var(--tint2); color: var(--mint-d); display: grid; place-items: center; flex: none; }
  @media (max-width: 560px) {
    .top { padding: 12px 14px; }
    .brand img { width: 32px; height: 32px; }
    .brand b { font-size: 15px; white-space: nowrap; }
    .eyebrow { margin-bottom: 8px; }
    h1 { font-size: 29px; margin-bottom: 8px; }
    .lead { font-size: 14.5px; margin-bottom: 12px; }
    .facts { gap: 6px; }
    .facts li { font-size: 12.5px; padding: 4px 10px 4px 4px; gap: 6px; }
    .facts i { width: 20px; height: 20px; }
    .facts i svg { width: 13px; height: 13px; }
  }
  @media (min-width: 960px) {
    .facts { flex-direction: column; gap: 12px; }
    .facts li { background: none; padding: 0; font-size: 15px; }
    .facts i { width: 30px; height: 30px; border-radius: 10px; }
  }
  .pick { display: none; margin-top: 28px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; }
  @media (min-width: 960px) { .pick.on { display: block; } }
  .pick p { margin: 0 0 8px; font: 700 11px/1 Inter, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .pick div { color: var(--ink); font-weight: 600; line-height: 1.45; }

  /* ---------- panel ---------- */
  .panel { background: var(--white); border: 1px solid var(--line); border-radius: 24px; padding: 24px; box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 16px 40px -18px rgba(16,24,40,.14); min-width: 0; }
  @media (max-width: 560px) { .panel { padding: 18px 16px; border-radius: 20px; } .wrap { padding-left: 14px; padding-right: 14px; } }
  .block + .block { margin-top: 22px; }
  .lbl { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font: 700 12px/1 Inter, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
  .lbl em { font: 800 13px/1 Manrope, sans-serif; font-style: normal; letter-spacing: 0; color: var(--mint-l); }
  .lbl .aside { margin-left: auto; display: flex; align-items: center; gap: 6px; font: 500 12px/1.2 Inter, sans-serif; letter-spacing: 0; text-transform: none; color: var(--muted); }
  .arrows { display: none; gap: 4px; }
  @media (pointer: fine) { .arrows { display: flex; } }
  .arrows button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink); }
  .arrows button:hover { background: var(--card); }

  .seg { display: grid; gap: 10px; }
  .seg.two { grid-template-columns: 1fr 1fr; }
  .seg.three { grid-template-columns: repeat(3, 1fr); }
  .opt { border: 1.5px solid var(--line); border-radius: 14px; padding: 11px 14px; background: var(--white); display: flex; align-items: center; gap: 12px; text-align: left; min-height: 58px; transition: border-color .15s, background-color .15s; }
  .opt:hover { border-color: var(--mint-l); }
  .opt[aria-pressed="true"] { border-color: var(--mint-d); background: var(--tint); box-shadow: inset 0 0 0 1px var(--mint-d); }
  .opt .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--card); color: var(--ink); display: grid; place-items: center; flex: none; }
  .opt[aria-pressed="true"] .ic { background: var(--white); color: var(--mint-d); }
  .opt b { display: block; color: var(--ink); font-weight: 600; line-height: 1.25; }
  .opt small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.25; }
  .seg.three .opt { justify-content: center; text-align: center; min-height: 50px; padding: 10px 6px; }
  .seg.three .opt b { font-variant-numeric: tabular-nums; }
  @media (max-width: 400px) { .opt .ic { display: none; } }

  .days { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; padding: 2px 2px 6px; margin: 0 -2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .days::-webkit-scrollbar { display: none; }
  .day { flex: 0 0 62px; scroll-snap-align: start; border: 1.5px solid var(--line); border-radius: 14px; padding: 9px 0 8px; background: var(--white); display: flex; flex-direction: column; align-items: center; gap: 1px; transition: border-color .15s; }
  .day:hover:not(:disabled) { border-color: var(--mint-l); }
  .day .wd { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .day b { font: 800 20px/1.15 Manrope, sans-serif; color: var(--ink); }
  .day .mo { font-size: 11px; color: var(--muted); }
  .day i { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); margin-top: 3px; }
  .day:disabled { opacity: .4; cursor: default; }
  .day:disabled i { background: var(--line); }
  .day[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); }
  .day[aria-pressed="true"] b, .day[aria-pressed="true"] .wd, .day[aria-pressed="true"] .mo { color: var(--white); }

  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; }
  .slot { height: 46px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--white); color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; transition: border-color .12s, background-color .12s; }
  .slot:hover { border-color: var(--mint-d); background: var(--tint); }
  .slot[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--white); }
  .empty { grid-column: 1 / -1; padding: 18px; border-radius: 14px; background: var(--card); text-align: center; }
  .empty a { color: var(--mint-d); font-weight: 600; }
  .sk { border-color: transparent !important; background: linear-gradient(90deg, #f1f2f3 25%, #e7e9eb 37%, #f1f2f3 63%) !important; background-size: 400% 100% !important; animation: sk 1.3s ease infinite; pointer-events: none; }
  .sk * { visibility: hidden; }
  @keyframes sk { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

  /* ---------- form ---------- */
  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-weight: 600; font-size: 14px; padding: 4px 0; }
  .back:hover { color: var(--ink); }
  .chosen { margin: 12px 0 22px; padding: 14px 16px; border-radius: 16px; background: var(--tint); border: 1px solid #c8f2e5; color: var(--ink); }
  .chosen b { display: block; font: 800 18px/1.25 Manrope, sans-serif; letter-spacing: -.01em; }
  .chosen span { display: block; margin-top: 2px; font-size: 14px; color: var(--body); }
  .grid2 { display: grid; grid-template-columns: 1fr; column-gap: 12px; }
  @media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } }
  .field { display: grid; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 13px; font-weight: 600; color: var(--ink); }
  .field label small { font-weight: 400; color: var(--muted); }
  .field input, .field textarea { width: 100%; height: 50px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--white); color: var(--ink); font: inherit; font-size: 16px; outline: none; transition: border-color .15s, box-shadow .15s; -webkit-appearance: none; appearance: none; }
  .field textarea { height: auto; min-height: 88px; padding: 12px 14px; resize: vertical; }
  .field input:focus, .field textarea:focus { border-color: var(--mint-d); box-shadow: 0 0 0 4px var(--tint2); }
  .field input[aria-invalid="true"] { border-color: var(--danger); box-shadow: 0 0 0 4px #fde8e8; }
  .field .hint { font-size: 12.5px; color: var(--muted); }
  .hp { position: absolute !important; left: -10000px; width: 1px; height: 1px; opacity: 0; }
  .cta { width: 100%; height: 56px; margin-top: 4px; border-radius: 14px; background: var(--ink); color: var(--white); display: flex; align-items: center; justify-content: center; gap: 12px; font: 700 16px/1 Inter, sans-serif; text-decoration: none; transition: background-color .15s, transform .08s; }
  .cta:hover { background: #000; }
  .cta:active { transform: scale(.99); }
  .cta[disabled] { cursor: progress; opacity: .8; }
  .cta .dot { width: 28px; height: 28px; border-radius: 50%; background: var(--mint); color: var(--ink); display: grid; place-items: center; flex: none; }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.35); border-top-color: var(--white); animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .note { margin: 12px 0 0; font-size: 13px; color: var(--muted); text-align: center; }

  /* ---------- done ---------- */
  .hero { border-radius: 20px; padding: 26px 22px 24px; margin-bottom: 16px; background: linear-gradient(135deg, var(--tint2) 0%, var(--blue-tint) 100%); }
  .check { width: 52px; height: 52px; border-radius: 50%; background: var(--mint); color: var(--ink); display: grid; place-items: center; margin-bottom: 14px; }
  .hero h2 { font-size: clamp(26px, 4vw, 32px); font-weight: 800; line-height: 1.12; margin-bottom: 8px; }
  .hero p { margin: 0; color: var(--ink); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 10px 18px; margin: 0 0 16px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 16px; }
  .kv dt { color: var(--muted); font-size: 13px; padding-top: 1px; }
  .kv dd { margin: 0; color: var(--ink); font-weight: 600; word-break: break-word; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .btn2 { height: 48px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--white); color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 14px; text-decoration: none; text-align: center; padding: 0 8px; }
  .btn2:hover { border-color: var(--mint-l); background: var(--tint); }
  .links { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 22px; margin-top: 18px; font-size: 14px; }
  .links a, .links button { color: var(--mint-d); font-weight: 600; text-decoration: none; }

  footer { max-width: 1120px; margin: 0 auto; padding: 0 20px 28px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--muted); }
  footer a { color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translate(-50%, 140%); max-width: min(92vw, 460px); padding: 13px 18px; border-radius: 14px; background: var(--ink); color: var(--white); font-weight: 500; font-size: 14px; box-shadow: 0 12px 32px -8px rgba(0,0,0,.35); transition: transform .25s ease, opacity .25s ease, visibility .25s; z-index: 10; opacity: 0; visibility: hidden; }
  .toast.on { transform: translate(-50%, 0); opacity: 1; visibility: visible; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

(() => {
  'use strict';

  const CONFIG = {
    API: window.MEET_API,
    OWNER: 'Javokhir Komiljonov',
    TELEGRAM: 'ceo_w2w',
    // Used until the backend answers (or when it is not configured). The backend's own settings win.

  const MIN = 60e3, DAY = 864e5;

  // ---------------------------------------------------------------- time helpers (displayed in the visitor's zone)
  const pad = n => String(n).padStart(2, '0');
  const parts = ms => { const d = new Date(ms); return { y: d.getFullYear(), m: d.getMonth(), d: d.getDate(), wd: d.getDay() }; };
  const dayKey = ms => { const p = parts(ms); return p.y + '-' + p.m + '-' + p.d; };
  const hhmm = ms => { const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  const longDate = ms => T[lang].date(parts(ms), T[lang]);
  const hm = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
  const isHomeZone = () => -new Date().getTimezoneOffset() === S.settings.offsetMin;
  const zoneLabel = () => isHomeZone() ? t('tz_home')

  /** Working-hour grid (Tashkent) minus busy ± buffer, grouped by the visitor's calendar day. */
  function buildDays() {
    const st = S.settings, off = st.offsetMin * MIN, now = Date.now();
    const dur = S.dur * MIN, buf = st.bufferMin * MIN, step = st.step * MIN;
    const earliest = now + st.minNoticeMin * MIN, latest = now + st.horizonDays * DAY;
    const t0 = Math.floor((now + off) / DAY) * DAY - off;
    const days = new Map();
    for (let i = 0; i <= st.horizonDays; i++) {
      const d0 = t0 + i * DAY, wd = new Date(d0 + off).getUTCDay();
      for (const [a, b] of (st.hours[wd] || [])) {
        const end = d0 + hm(b) * MIN;
        for (let s = d0 + hm(a) * MIN; s + dur <= end; s += step) {
          if (s < earliest || s > latest) continue;
          const k = dayKey(s);
          if (!days.has(k)) days.set(k, { ms: s, slots: [] });
          const e = s + dur;
          if (!S.busy.some(x => x[0] < e + buf && x[1] > s - buf)) days.get(k).slots.push(s);
        }
      }
    }
    return days;
  }

      return;

    const days = buildDays();
    const keys = [...days.keys()];
    if (!keys.length) {
      $('#days').innerHTML = '';
      $('#slots').innerHTML = `<div class="empty">${t('no_days')} <a href="https://t.me/${CONFIG.TELEGRAM}" target="_blank" rel="noopener">${t('write_tg')}</a></div>`;

    if (!days.has(S.day) || !days.get(S.day).slots.length) S.day = keys.find(k => days.get(k).slots.length) || keys[0];

    if (!S.settings.durations.includes(S.dur)) S.dur = S.settings.durations[0];

  function request(url, opt, ms) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, Object.assign({ signal: ctrl.signal, redirect: 'follow' }, opt))
      .then(r => r.json()).finally(() => clearTimeout(timer));
  }

  async function load(fresh) {
    if (!CONFIG.API) { S.loaded = true; renderPick(); return; }
    try {

      const r = (pre && await pre) || await request(CONFIG.API + '?action=slots' + (fresh ? '&fresh=1' : ''), {}, 20000);
      if (!r || !r.ok) throw new Error('bad response');
      apply(r);
      store.set(CACHE_KEY, { at: Date.now(), r });
    } catch (_) {
      if (!S.live) S.failed = true;
    }
    S.loaded = true;
    if (S.view === 'pick') renderPick();
    renderForm();
  }

      if (!window.open(tgUrl, '_blank')) location.href = tgUrl;
      S.done = { tg: true, tgUrl };
      go('done');
      return;
    }

    S.sending = true; renderForm();
    try {
      const r = await request(CONFIG.API, {
        method: 'POST', // text/plain body → no CORS preflight against Apps Script
        body: JSON.stringify(Object.assign({ action: 'book', mode: S.mode, duration: S.dur, start: S.slot }, d)),
      }, 45000);
      if (r && r.ok) {
        S.done = Object.assign({ email: d.email, name: d.name }, r);
        localStorage.removeItem(CACHE_KEY);
        go('done');
        load(true);
      } else if (r && r.error === 'slot_taken') {
        toast(t('e_taken'));
        S.slot = null;
        S.view = 'pick';
        await load(true);
        go('pick');
      } else {
        toast(t(r && r.error === 'too_many' ? 'e_many' : 'e_generic'));
      }
    } catch (_) {
      toast(t('e_generic'));
    } finally {
      S.sending = false; renderForm();
    }
  });

  // ---------------------------------------------------------------- calendar exports for the client
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const utc = ms => new Date(ms).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const evDetails = r => [r.meet ? 'Google Meet: ' + r.meet : '', 'Telegram: https://t.me/' + CONFIG.TELEGRAM].filter(Boolean).join('\n');
  const evWhere = r => r.mode === 'online' ? (r.meet || 'Google Meet') : (r.location || '');

  function gcalUrl(r) {
    return 'https://calendar.google.com/calendar/render?' + new URLSearchParams({
      action: 'TEMPLATE', text: t('ev_title'), dates: utc(r.start) + '/' + utc(r.end), details: evDetails(r), location: evWhere(r),
    });
  }

  function downloadIcs(r) {
    const x = s => String(s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1');
    const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//W2W//meet//EN', 'METHOD:PUBLISH', 'BEGIN:VEVENT',
      'UID:' + (r.id || Date.now()) + '@javokhirkomiljanov.github.io', 'DTSTAMP:' + utc(Date.now()),
      'DTSTART:' + utc(r.start), 'DTEND:' + utc(r.end), 'SUMMARY:' + x(t('ev_title')),
      'DESCRIPTION:' + x(evDetails(r)), 'LOCATION:' + x(evWhere(r)), 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
    a.download = 'meeting-javokhir.ics';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  const svg = (d, w = 18) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const ICON_OK = svg('<path d="M5 12.5 10 17l9-10"/>', 24);
  const ICON_TG = svg('<path d="m21 4-18 7.5 6 2L20 6l-8.5 9.5V20l3.2-3.6L19 20Z"/>', 24);
  const ICON_ARROW = svg('<path d="M5 12h14M13 6l6 6-6 6"/>', 14);
  const ICON_CAL = svg('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>', 16);
  const ICON_DL = svg('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>', 16);

  // ---------------------------------------------------------------- events
  document.addEventListener('click', e => {
    const el = e.target.closest('button, a');
    if (!el) return;
    if (el.dataset.lang) { lang = el.dataset.lang; store.set('meet:lang', lang); render(); return; }
    if (el.dataset.mode) { S.mode = el.dataset.mode; renderPick(); return; }
    if (el.dataset.dur) { S.dur = Number(el.dataset.dur); renderPick(); return; }
    if (el.dataset.k) { S.day = el.dataset.k; S.slot = null; renderPick(); return; }
    if (el.dataset.s) { S.slot = Number(el.dataset.s); go('form'); return; }
    if (el.id === 'back') { go('pick'); return; }
    if (el.id === 'prev' || el.id === 'next') { $('#days').scrollBy({ left: (el.id === 'next' ? 1 : -1) * 280, behavior: 'smooth' }); return; }
    if (el.hasAttribute('data-ics')) { downloadIcs(S.done); return; }
    if (el.hasAttribute('data-again')) { S.done = null; S.slot = null; go('pick'); }
  });

  // ---------------------------------------------------------------- boot
  const me = store.get('meet:me');
  if (me) for (const k of ['name', 'contact', 'email', 'company']) if (me[k]) $('#f-' + k).value = me[k];

  const cached = CONFIG.API && store.get(CACHE_KEY);
  if (cached && cached.r && Date.now() - cached.at < CACHE_TTL) { apply(cached.r); S.loaded = true; }
  render();
  load(false);
})();
</script>
</body>
</html>
